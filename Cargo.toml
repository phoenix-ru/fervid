[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.dependencies]
flagset = "0.4.6"
fxhash = "0.2.1"
phf = { version = "0.14", features = ["macros"] }
smallvec = "1.10.0"
strum = "0.28"
strum_macros = "0.28"
swc_core = { version = "85", features = ["ecma_ast"] }
swc_ecma_codegen = "34"
swc_ecma_parser = "48"
swc_ecma_lexer = "47"
swc_html_ast = "28"
swc_html_parser = "28"

[profile.release]
# Configurations explicitly listed here for clarity.
# Using the best options for performance.
opt-level     = 3
lto           = "fat"
codegen-units = 1
strip         = "symbols"
debug         = false
panic         = "abort"   # Let it crash and force ourselves to write safe Rust.

# Use the `--profile release-debug` flag to show symbols in release mode.
# e.g. `cargo build --profile release-debug`
[profile.release-debug]
inherits = "release"
strip    = false
debug    = true
